[build-system]
requires = ["setuptools>=77.0.0", "wheel", "cement==3.0.16"]
build-backend = "setuptools.build_meta"

[project]
name = "tokeo-fundi"
dynamic = ["version"]  # Declare version as dynamic
description = "Tokeo Fundi AI Extension for Tokeo CLI"
readme = "README.md"
authors = [
    {name = "Tom Freudenberg", email = "th.freudenberg@gmail.com"}
]
license = "LicenseRef-Tokeo-Fundi-Source-Available-1.0"
license-files = ["LICENSE.md"]
urls = {"Homepage" = "https://github.com/tokeo/fundi"}
requires-python = ">=3.11"

dependencies = [
    "tokeo >= 2.2.0, < 3.0.0",
    # packages necessary to run fundi
    "prompt_toolkit",
    "httpx >= 0.23.0",
]

[project.optional-dependencies]
# the wasm sandbox: pip install 'tokeo-fundi[wasm]'
wasm = [
    "wasmtime>=48.0.0",
]
dev = [
    "pip-tools>=7.0.0",
    "build>=1.0.0",
    "setuptools>=83.0.0",
    "wheel>=0.46.2",
    "twine>=6.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "coverage>=7.10.0",
    "pyink>=26.5.1",
    "flake8>=7.0.0",
    "watchdog",
    # packages necessary to run all macros
    "numpy",
    "numba",
    "torch",
    "wasmtime>=48.0.0",
]

[tool.setuptools]
packages = {find = {namespaces = true, include = ["tokeo", "tokeo.*"], exclude = ["ez_setup", "tests*"]}}
include-package-data = true

[tool.setuptools.package-data]
"tokeo" = ["**/*.md"]

[tool.setuptools.dynamic]
version = {attr = "tokeo.core.ai.fundi.get_version"}
